# Whorld show configuration (example).
#
# This is the preferred way to configure the kiosk: start Whorld with
#     --config /usr/local/share/whorld/whorld.conf
# and edit this one readable file instead of building a long WHORLD_ARGS line.
# A config supplies *defaults*; any flag you also pass on the command line
# still overrides the file, so the same file works for several setups.
#
# Format: one `key = value` per line. `#` and `;` start a full-line comment,
# blank lines are ignored, whitespace around the key and value is trimmed and
# keys are case-sensitive. Values may contain `#`/`;` (only a leading one is a
# comment). Paths are used as given; relative paths are relative to Whorld's
# working directory, so prefer absolute paths on a kiosk.
#
# `whorld --help` lists the matching flags. Every key below is optional; the
# stock value is shown next to it, so delete or comment out whatever you do
# not need. `whorld --config-save /tmp/whorld.conf` writes the effective
# settings of a running command line back out in this format.

# --- show content ----------------------------------------------------------
patch = /usr/local/share/whorld/demo.whp
playlist =

# --- rendering -------------------------------------------------------------
# renderer = auto            # auto | gpu | cairo
# scale = 0                  # 0 = adaptive, otherwise 0.25 .. 2.0
# blend = normal             # normal | add | screen
# morph = 0                  # crossfade playlist patches over N seconds

# --- post-processing -------------------------------------------------------
# mirror = off               # off | quad | kaleidoscope | radial
# invert = false             # invert colour channels
# feedback = 0               # video-feedback trails, 0.0 .. 0.99

# --- projection mapping ----------------------------------------------------
# Same 8-number format as --warp (commas or whitespace, TL,TR,BR,BL order).
# Use either warp or warpFile (a file of four "x y" pairs).
# warp = 0.06,0.04,0.95,0.10,0.90,0.96,0.10,0.88
# warpFile =

# --- display / kiosk -------------------------------------------------------
# videoDriver = kmsdrm       # SDL_VIDEODRIVER, e.g. kmsdrm, x11, offscreen
fullscreen = true
hideCursor = true

# --- MIDI ------------------------------------------------------------------
# midiSource = 24:0          # ALSA CLIENT:PORT (see `whorld --list-midi`)
# midiMode = absolute        # absolute | 14bit | rel-twos | rel-sign | rel-binary
# midiTakeover = false       # soft takeover for absolute/14-bit controls
# midiOut =                  # CLIENT:PORT; empty creates a virtual output port
# midiOutEnabled = false     # true to create/connect the MIDI output
# midiFeedback = false       # echo mapped controls back to the controller
# midiClock = false          # follow an external MIDI clock as the tempo

# --- OSC -------------------------------------------------------------------
# osc = false                # --osc: apply through the playlist [Osc] mappings
# oscPort = 8000             # port for the above
# oscDirect = false          # --osc-port: /whorld/<Target> convention addressing
# oscDirectPort = 8000       # port for the above

# --- audio -----------------------------------------------------------------
# audio = false              # microphone/line input
# audioDevice = default      # ALSA device name
# audioGain = 1.0            # analysis gain
